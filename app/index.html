<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanční deník</title>
<meta name="description" content="Zápisník na peníze, který se počítá sám.">
<meta name="theme-color" content="#5b3620">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/fonty.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-desky="hneda" data-stul="dub" data-papir="kremova" data-linky="linky">
<div id="login" hidden></div>
<div id="app" hidden>
  <div class="stul">
    <aside class="desky" aria-label="Desky deníku">
      <div class="logo">
        <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#f3e3bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 58V34M32 44l-8-7M32 40l9-8M26 58h12"/><circle cx="32" cy="22" r="10"/><circle cx="20" cy="27" r="8"/><circle cx="44" cy="27" r="8"/><circle cx="25" cy="14" r="6"/><circle cx="40" cy="13" r="6"/></g></svg>
        <b>Finanční deník</b><span>kniha tvého finančního života</span>
      </div>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="menu"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Menu</button>
      <nav class="menu" id="menu" aria-label="Stránky deníku"></nav>
      <p class="motto">Malé kroky,<br>velké výsledky.</p>
      <span class="stav" id="stav"></span>
      <button class="zavrit-btn" data-act="zavrit">Zavřít knihu</button>
    </aside>
    <main class="book" id="book">
      <section class="page L" id="pL"></section><section class="page R" id="pR"></section>
      <div class="rejstrik" aria-label="Rejstřík">
        <a href="#prehled" style="background:#f2a6a0">Přehled</a><a href="#den" style="background:#f5d56b">Den</a><a href="#mesic" style="background:#a9d39a">Měsíc</a><a href="#cile" style="background:#9cc3e6">Cíle</a><a href="#zivot" style="background:#c9b3e6">Život</a>
      </div>
    </main>
  </div>
  <button class="nal-btn" data-act="nalarch" aria-label="Nálepky a lepicí lístky" title="Nálepky a lístky"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M6 5h20v14l-7 8H6z" fill="#fff08a" stroke="#c9a227" stroke-width="1.6" stroke-linejoin="round"/><path d="M26 19h-7v8" fill="#f1d75a" stroke="#c9a227" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.5 9l1.6 3.4 3.7.5-2.7 2.6.7 3.7-3.3-1.8-3.3 1.8.7-3.7-2.7-2.6 3.7-.5z" fill="#e8505b"/></svg></button>
</div>
<div id="zavrena" class="zavrena" hidden></div>
<div id="arch" class="arch" role="dialog" aria-modal="true" aria-labelledby="archT" hidden></div>
<div id="tisk" class="tisk" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <filter id="fd-vyrez" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3.2" result="obrys"/>
    <feFlood flood-color="#fff"/><feComposite in2="obrys" operator="in" result="bila"/>
    <feGaussianBlur in="obrys" stdDeviation="1.4" result="rozm"/><feOffset in="rozm" dx="0.6" dy="1.8" result="pos"/>
    <feFlood flood-color="#000" flood-opacity=".32"/><feComposite in2="pos" operator="in" result="stin"/>
    <feMerge><feMergeNode in="stin"/><feMergeNode in="bila"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs></svg>
<div id="blocek" class="blocek" role="dialog" aria-modal="true" aria-labelledby="bt" hidden></div>
<p id="toast" class="toast" role="status" hidden></p>
<noscript><p style="padding:24px;color:#fff">Finanční deník potřebuje zapnutý JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
