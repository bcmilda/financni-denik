# Finanční deník – Android appka (náhled)
# Po každém pushi do dev se appka sestaví jako APK a nahraje do GitHub Releases
# pod názvem „Android náhled“. Odtud ji jde stáhnout přímo do telefonu a nainstalovat.
name: Android APK

on:
  push:
    branches: [dev]
    paths: ['app/**', 'android/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy logiky
        run: npm test
      - name: Instalace a synchronizace webové části do Androidu
        run: |
          npm ci
          npx cap sync android
      - name: Sestavení APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Přejmenování
        run: |
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "financni-denik-$V-nahled-${{ github.run_number }}.apk"
          echo "APK=financni-denik-$V-nahled-${{ github.run_number }}.apk" >> $GITHUB_ENV
          echo "VER=$V" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}
      - name: Zveřejnit v Releases (Android náhled)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-nahled --yes --cleanup-tag || true
          gh release create android-nahled "$APK" --target "$GITHUB_SHA" --prerelease \
            --title "Android náhled $VER (sestavení ${{ github.run_number }})" \
            --notes "Stáhni APK v telefonu a nainstaluj (povol instalaci z prohlížeče). Novější sestavení jde nainstalovat přes starší, data zůstanou. Commit: ${{ github.event.head_commit.message }}"
